AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  italy-planner API. Hono on AWS Lambda behind an HTTP API. CloudFront (infra/terraform/platform)
  is the only intended caller: it adds the x-origin-verify header that the function checks.

# Deploy from this directory: sam deploy (settings in samconfig.toml). CI runs
# .github/scripts/deploy-api.sh, which passes GitSha. infra/test/sam-template.test.ts checks the
# guardrails below (timeout, concurrency, runtime, log retention, throttling, environment, the
# trips table and the function's rights on it).

Parameters:
  GitSha:
    Type: String
    Default: local
    AllowedPattern: "^([0-9a-f]{40}|local)$"
    Description: Commit being deployed. /api/health reports it so the smoke test can prove the rollout.
  AnthropicModel:
    Type: String
    Default: claude-sonnet-5
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{2,63}$"
  AnthropicKeyParam:
    Type: String
    Default: /italy-planner/anthropic-api-key
    AllowedPattern: "^/italy-planner/[A-Za-z0-9_.-]+$"
    Description: SSM SecureString holding the Anthropic API key (created by a human, never by IaC).
  OriginVerifyParam:
    Type: String
    Default: /italy-planner/origin-verify-secret
    AllowedPattern: "^/italy-planner/[A-Za-z0-9_.-]+$"
    Description: SSM SecureString with the CloudFront origin secret (created by infra/terraform/platform).
  PermissionsBoundaryArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:policy/italy-planner-boundary$"
    Description: Boundary from infra/terraform/bootstrap. The deploy role cannot create a role without it.
  LlmEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for the AI layer. "false" serves rules-only plans.
  AlarmEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Optional address for alarm emails (confirm the subscription email once).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/italy-planner-api
      RetentionInDays: 14

  # Saved trips (a year), the AI content of recent plans (90 days) and AI plans cached for the
  # options they answer (7 days), one item each, removed by time to live on expiresAt (epoch
  # seconds). services/api/src/trips/store.ts reads and writes it.
  # Decision: on-demand billing. Saves are rare and bursty, so provisioned capacity would sit idle
  # and still need autoscaling rights the deploy role does not have.
  # Decision: Retain on delete and on replacement, so removing or renaming this resource in the
  # template can never delete travelers' saved trips; an admin removes the table by hand.
  # Decision: deletion protection on as well, so no caller (a console slip, a script with an
  # admin's rights) can delete the table either; an admin turns it off first, on purpose. It is a
  # CreateTable and UpdateTable setting, which the deploy role already has.
  # Decision: no SSESpecification. DynamoDB encrypts every table at rest, with an AWS owned key
  # unless told otherwise (SSEEnabled true would switch to a KMS key). A KMS key would need key
  # rights the deploy role deliberately lacks (its guardrails deny kms:Decrypt), and the table
  # holds no personal data: trip requests are stored without the traveler's notes, AI text that
  # may repeat them is left out, and a plan made with notes is never cached here. (trivy reports
  # this as AVD-AWS-0025, LOW, below the HIGH and CRITICAL that fail CI.)
  TripsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: italy-planner-trips
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: italy-planner-api-function
      Description: Execution role for italy-planner-api. Capped by the italy-planner boundary.
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-and-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}"
              - Sid: ReadOwnParameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParam}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OriginVerifyParam}"
              - Sid: DecryptParametersViaSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" }
        # Read one record and write new ones: no query, scan, update or delete.
        - PolicyName: trips-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAndWriteTrips
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt TripsTable.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: italy-planner-api
      Description: italy-planner API (Hono). Handles /api/* behind CloudFront.
      CodeUri: ../../services/api/dist
      Handler: lambda.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 512
      # Decision: 29 s, one second under API Gateway's 30 s integration cap, so the function
      # (with PLAN_DEADLINE_MS 24 s) always answers before the gateway gives up on it.
      Timeout: 29
      # Decision: 10 concurrent executions caps the worst-case Claude spend and protects the
      # other stacks in this account from sharing an exhausted concurrency pool.
      ReservedConcurrentExecutions: 10
      Role: !GetAtt ApiFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
        LogFormat: Text
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --enable-source-maps
          ANTHROPIC_API_KEY_PARAM: !Ref AnthropicKeyParam
          ORIGIN_VERIFY_PARAM: !Ref OriginVerifyParam
          ANTHROPIC_MODEL: !Ref AnthropicModel
          LLM_ENABLED: !Ref LlmEnabled
          # Real Claude API client; the API refuses to start in fixture mode in production.
          LLM_MODE: anthropic
          LLM_TIMEOUT_MS: "15000"
          PLAN_DEADLINE_MS: "24000"
          LLM_MAX_ATTEMPTS: "2"
          LLM_EFFORT: low
          LOG_LEVEL: info
          GIT_SHA: !Ref GitSha
          TRIPS_TABLE: !Ref TripsTable
      Events:
        # Routes of their own, so POST /api/plan and POST /api/trips get tighter throttles than
        # the read routes. GET /api/trips/{id} stays on the proxy route with the reads.
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/plan
            Method: POST
        SaveTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/trips
            Method: POST
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: italy-planner-api
      Description: italy-planner API. Called through CloudFront only (origin-verify header).
      FailOnWarnings: true
      # Decision: gateway throttling in front of the function's own limiter, split by route.
      # Plans hold an instance for seconds (the model call), so POST /api/plan gets 1 per second
      # with a burst of 6, below the reserved concurrency of 10: a plan flood gets clean 429s and
      # always leaves instances for the read routes. Those answer in milliseconds, and every page
      # load needs two of them, so they get 50 per second with a burst of 100. The WAF adds a
      # per-IP limit on plan calls at the edge (/api/plan on the site, /plan on the API host).
      # Decision: saving a trip (POST /api/trips) gets 2 per second with a burst of 10. A save is
      # one press of Copy link, so real use is far below that, and it caps what a flood can write
      # (each saved trip is kept a year) at about 170,000 items a day, without taking the read
      # routes' share. Opening a trip (GET) stays with the reads, so links open as fast as pages.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      RouteSettings:
        "POST /api/plan":
          ThrottlingBurstLimit: 6
          ThrottlingRateLimit: 1
        "POST /api/trips":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
      # Decision: no API access logs. HTTP API access logging needs an account-wide CloudWatch Logs
      # resource policy, and this account is shared. Throttled and failed calls still show in the
      # API's 4xx and 5xx metrics, and every call that reaches the function is logged by it.
      Tags:
        Project: italy-planner

  # Decision: no KMS key on this topic (trivy AVD-AWS-0095). CloudWatch alarms cannot publish to
  # a topic encrypted with the AWS managed aws/sns key, alarm messages carry no secrets, and a
  # customer managed key would need key policy rights the deploy role deliberately lacks.
  # trivy:ignore:AVD-AWS-0095
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: italy-planner-alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-errors
      AlarmDescription: The API function threw unhandled errors (the plan route should never 500).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-throttles
      AlarmDescription: Requests hit the reserved concurrency cap of 10.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  FunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-slow
      AlarmDescription: p99 duration is near the 29 s timeout; plans risk the gateway's 30 s cap.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-5xx
      AlarmDescription: The HTTP API returned 5xx responses (function errors, timeouts, throttles).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # The next two alarm on metrics the function writes itself (Embedded Metric Format on its
  # request log line, services/api/src/lib/metrics.ts). A handled 500, a 503, or every plan
  # quietly falling back to rules-only never shows in the Lambda Errors metric above.
  HandledServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-server-errors
      AlarmDescription: The function answered 500 or 503 (handled errors the Lambda Errors metric misses).
      Namespace: italy-planner
      MetricName: ServerErrors
      Dimensions: [{ Name: Service, Value: italy-planner-api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  TripStoreFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-trip-store
      AlarmDescription: >-
        Reads or writes of the trips table failed (missing IAM rights, throttling, a DynamoDB
        outage). Plans still go out, but without the record that lets them be saved with AI why
        lines, and Copy link falls back to the rebuild-from-ids link.
      Namespace: italy-planner
      MetricName: TripStoreFailures
      Dimensions: [{ Name: Service, Value: italy-planner-api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ModelFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: italy-planner-api-model-failures
      AlarmDescription: >-
        Over half of AI plans in 15 minutes fell back because the model call failed or the key
        could not be read (revoked key, wrong model parameters, SSM or Anthropic outage).
      Metrics:
        - Id: plans
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: italy-planner
              MetricName: AiPlans
              Dimensions: [{ Name: Service, Value: italy-planner-api }]
            Period: 900
            Stat: Sum
        - Id: failures
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: italy-planner
              MetricName: AiPlanModelFailures
              Dimensions: [{ Name: Service, Value: italy-planner-api }]
            Period: 900
            Stat: Sum
        # Decision: at least 3 plans before the share counts, so one failed plan at 3 am is not
        # an incident.
        - Id: share
          Label: Share of AI plans whose model call failed
          Expression: IF(plans >= 3, failures / plans, 0)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

Outputs:
  HttpApiId:
    Description: API id. Pinned in infra/terraform/bootstrap (http_api_id) after the first deploy.
    Value: !Ref HttpApi
  HttpApiUrl:
    Description: Direct execute-api URL. Only the smoke test uses it, to prove it refuses callers.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  HttpApiDomain:
    Description: Origin of the site's /api/* behavior and of the API host distribution (read by infra/terraform/platform).
    Value: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionName:
    Description: Function name, for logs and the deploy summary.
    Value: !Ref ApiFunction
